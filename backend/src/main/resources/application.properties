# ========================================
# RaiseTimeLine バックエンド設定
# ========================================
spring.application.name=backend

# --- サーバー設定 ---
# ポートルール: バックエンドは必ず 8080 で起動する（別ポートへの変更禁止）
server.port=8080

# --- データベース接続設定 ---
# PostgreSQL 16 への接続情報。ローカル開発用の値。
# 本番環境では環境変数で上書きすること（平文でパスワードをコミットしない）
spring.datasource.url=jdbc:postgresql://localhost:5432/raisetimeline
spring.datasource.username=raisetimeline
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway（DBマイグレーション）設定 ---
# true にするとアプリ起動時に未適用のマイグレーション SQL を自動で実行する
spring.flyway.enabled=true
# マイグレーション SQL ファイルの置き場所
spring.flyway.locations=classpath:db/migration

# --- MyBatis 設定 ---
# Mapper XML ファイルの置き場所（** はサブディレクトリも含む）
mybatis.mapper-locations=classpath:mapper/**/*.xml
# DB のスネークケース（例: password_hash）を Java のキャメルケース（passwordHash）に自動変換する
# これにより Mapper XML に ResultMap を書かなくてもフィールドが自動マッピングされる
mybatis.configuration.map-underscore-to-camel-case=true

# --- JWT 設定 ---
# JWT の署名に使うシークレットキー
# HS256 アルゴリズムでは 256bit（32バイト = 32文字以上）のキーが必須
# 本番環境では環境変数 APP_JWT_SECRET で設定し、このファイルには書かないこと
app.jwt.secret=RaiseTimeLineSecretKey2024_ChangeThisInProduction!!
# JWT の有効期限（ミリ秒）: 86400000ms = 24時間
# 24時間後はトークンが無効になり、再ログインが必要になる
app.jwt.expiration-ms=86400000
