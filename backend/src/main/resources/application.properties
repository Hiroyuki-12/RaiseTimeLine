# ========================================
# RaiseTimeLine バックエンド設定
# ========================================
spring.application.name=raise-time-line

# --- ログ出力設定（構造化ログ / JSON） ---
# Spring Boot 標準の Structured Logging で、コンソール出力を ECS（Elastic Common Schema）形式の
# 1 行 1 JSON にする。各行が機械可読になり、ログ収集基盤での検索 / 集計がしやすくなる。
# 詳しい設計は docs/logging-spec.md を参照。
logging.structured.format.console=ecs

# --- サーバー設定 ---
# ポートルール: バックエンドは必ず 8080 で起動する（別ポートへの変更禁止）
server.port=8080

# --- データベース接続設定 ---
# PostgreSQL 16 への接続情報。ローカル開発用の値。
# 本番環境では環境変数で上書きすること（平文でパスワードをコミットしない）
spring.datasource.url=jdbc:postgresql://localhost:5432/raisetimeline
spring.datasource.username=raisetimeline
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Flyway（DBマイグレーション）設定 ---
# true にするとアプリ起動時に未適用のマイグレーション SQL を自動で実行する
spring.flyway.enabled=true
# マイグレーション SQL ファイルの置き場所
spring.flyway.locations=classpath:db/migration

# --- MyBatis 設定 ---
# Mapper XML ファイルの置き場所（** はサブディレクトリも含む）
mybatis.mapper-locations=classpath:mapper/**/*.xml
# DB のスネークケース（例: password_hash）を Java のキャメルケース（passwordHash）に自動変換する
# これにより Mapper XML に ResultMap を書かなくてもフィールドが自動マッピングされる
mybatis.configuration.map-underscore-to-camel-case=true

# --- JWT 設定 ---
# JWT の署名に使うシークレットキー
# HS256 アルゴリズムでは 256bit（32バイト = 32文字以上）のキーが必須
# 本番環境では環境変数 APP_JWT_SECRET で設定し、このファイルには書かないこと
app.jwt.secret=RaiseTimeLineSecretKey2024_ChangeThisInProduction!!
# アクセストークンの有効期限（ミリ秒）: 900000ms = 15分
# 短命にすることで漏洩時のリスクを限定する。期限切れ後はリフレッシュトークンで再発行する
app.jwt.expiration-ms=900000
# リフレッシュトークンの有効期限（ミリ秒）: 604800000ms = 7日間
# HttpOnly Cookie に保存して JS からアクセスできないようにする（XSS 対策）
app.jwt.refresh-expiration-ms=604800000

# --- AWS S3 設定 ---
# プロフィール画像・投稿画像の保存先。
# アクセスキー・シークレットキーは本番環境では環境変数で上書きすること（このファイルにはダミー値のみ書く）。
# 実際の値は .env ファイルや OS の環境変数 AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY で設定する。
aws.s3.bucket-name=raisetimeline-images-okkun
aws.s3.region=ap-northeast-1
# 認証情報は ~/.aws/credentials（aws configure で設定）または環境変数から自動取得する
# コードやプロパティファイルに直接書かないことでセキュリティリスクを防ぐ

# アップロード可能なファイルの最大サイズ（Spring Boot デフォルト 1MB を 10MB に拡張）
# 実際のバリデーション（2MB以下）はアプリ層で行うが、ここで上限を緩めておかないと弾かれる
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# --- API ドキュメント（springdoc-openapi / Swagger UI）設定 ---
# Controller のアノテーションから OpenAPI 3 仕様を自動生成し、ブラウザで API を確認できるようにする。
# 仕様 JSON のパス。フロントエンドの TS 型生成等で利用する場合はこの URL を叩く。
springdoc.api-docs.path=/v3/api-docs
# Swagger UI のパス。http://localhost:8080/swagger-ui.html で開ける。
springdoc.swagger-ui.path=/swagger-ui.html
# UI 上で Tag（Controller 単位のグループ）をアルファベット順に並べる
springdoc.swagger-ui.tags-sorter=alpha
# UI 上でメソッド（GET/POST 等）順に並べる。実装順より一覧性が良い
springdoc.swagger-ui.operations-sorter=method
