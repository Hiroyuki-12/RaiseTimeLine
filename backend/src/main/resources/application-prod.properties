# ============================================================
# 本番(AWS / ECS Fargate)用の上書き設定
#
# SPRING_PROFILES_ACTIVE=prod のときに application.properties に追加で読み込まれ、
# 同名キーはこちらが優先される。ECS のタスク定義で prod プロファイルを有効化する。
# DB 接続情報・JWT シークレット・S3 バケット名などは「環境変数 / SSM」で注入するため
# ここには書かない（機密をコミットしないため）。本番固有の挙動だけをここに置く。
# ============================================================

# --- Cookie を HTTPS 限定にする ---
# 本番はユーザー⇄CloudFront 間が HTTPS のため、リフレッシュトークン Cookie に
# Secure 属性を付け、暗号化されていない通信では送信させない（盗聴・漏洩対策）。
app.cookie.secure=true
